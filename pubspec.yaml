name: nav_islands
# pub.dev wants 60-180 characters: search results show only the first part, and
# anything longer costs a pub point. The detail that used to live here is in
# the README.
description: >-
  A floating island bottom navigation bar for Flutter. Each page asserts its own
  island layout, and the bar morphs between them.
# Prerelease until the API has been exercised in anger: pub.dev keeps a
# `-beta` version off the "latest stable" slot, so it only reaches people who
# ask for it by name (`nav_islands: ^0.1.0-beta.1`).
version: 0.1.0-beta.9
# Authorship on pub.dev comes from the LICENSE copyright holder and the
# verified publisher this is published under (gold-development.nl); the
# `author:` field was removed from pubspec in Dart 2.
repository: https://github.com/gold-development/nav_islands
issue_tracker: https://github.com/gold-development/nav_islands/issues
# The pub.dev gallery. The README's animations live in doc/, which .pubignore
# keeps out of the package.
screenshots:
  - description: Three islands, a count badge and a filled call-to-action
    path: screenshots/home.png
  - description: A quick-actions fan opening out of the + chip
    path: screenshots/fan.png
  - description: Wide primary buttons and a fan from a centre chip
    path: screenshots/compose.png
  - description: Cancel and Send riding on top of the keyboard
    path: screenshots/keyboard.png
  - description: A bare centre island holding a bigger button
    path: screenshots/emergency.png
  - description: A dark page's pills, with the theme switches of the example
    path: screenshots/settings.png
  - description: The building blocks used on their own
    path: screenshots/building_blocks.png

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Flutter and nothing else — not even Material. State is a plain
# ChangeNotifier, navigation is caller-supplied callbacks, glyphs are painted
# by the caller (NavIcon.custom), and colours come from NavIslandsThemeData.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
